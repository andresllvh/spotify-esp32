; ============================================================
; PlatformIO - Spotify Now Playing (chaveiro)
; ============================================================
; Placa:   ESP32-C3 Super Mini (4 MB flash, sem PSRAM)
; Display: TFT 1.8" SPI ST7735 128x160 (usado em paisagem, 160x128)
; Botões:  3 botões táteis (anterior, play/pause, próxima)
;
; Ligações (ESP32-C3 Super Mini -> módulo TFT):
;   3V3   -> VCC
;   GND   -> GND
;   GPIO4 -> SCK / SCL
;   GPIO6 -> SDA / MOSI
;   GPIO7 -> CS
;   GPIO3 -> A0 / DC / RS
;   GPIO10-> RESET / RES
;   GPIO5 -> LED / BL (luz de fundo)
;
; Botões (um lado no GPIO, o outro no GND; usa pull-up interno):
;   GPIO0  -> anterior
;   GPIO1  -> play / pause
;   GPIO20 -> próxima
;
; GPIO2, GPIO8 e GPIO9 são pinos de boot do C3 e ficam livres.
; GPIO8 é o LED azul da placa (usado como indicador).
; ============================================================

[platformio]
default_envs = esp32c3_st7735

[env:esp32c3_st7735]
platform = espressif32@~6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; Arduino-ESP32 2.x (TFT_eSPI ainda não é estável no core 3.x)
platform_packages =
    framework-arduinoespressif32 @ ~3.20014.0

board_build.partitions = huge_app.csv
board_build.flash_mode = dio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Serial pela USB nativa do C3 (Super Mini não tem chip USB-serial)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- TFT_eSPI: ST7735 1.8" 128x160 ---
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    ; Variante do painel. Se as cores ou as bordas saírem erradas,
    ; troque por ST7735_GREENTAB, ST7735_GREENTAB2 ou ST7735_REDTAB.
    -DST7735_BLACKTAB=1

    -DTFT_MISO=-1
    -DTFT_SCLK=4
    -DTFT_MOSI=6
    -DTFT_CS=7
    -DTFT_DC=3
    -DTFT_RST=10
    -DTFT_BL=5
    -DTFT_BACKLIGHT_ON=HIGH

    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

    ; --- Pinos do projeto ---
    -DPIN_BTN_PREV=0
    -DPIN_BTN_PLAY=1
    -DPIN_BTN_NEXT=20
    -DPIN_STATUS_LED=8
    -DSTATUS_LED_ACTIVE_LOW=1

    -DARDUINOJSON_ENABLE_PROGMEM=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17
